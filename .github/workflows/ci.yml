name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python from .python-version
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: test-secret-key
          DEBUG: "1"
          ALLOWED_HOSTS: 127.0.0.1,localhost
        run: uv run python manage.py check

      - name: Check missing migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: test-secret-key
          DEBUG: "1"
          ALLOWED_HOSTS: 127.0.0.1,localhost
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: test-secret-key
          DEBUG: "0"
          ALLOWED_HOSTS: 127.0.0.1,localhost
        run: uv run python manage.py test

  billing-postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: netxodo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d netxodo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python from .python-version
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run Billing concurrency tests on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: test-secret-key
          DEBUG: "0"
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/netxodo_test
        run: uv run python manage.py test apps.billing.tests_concurrency --verbosity 2
