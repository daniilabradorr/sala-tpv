{% if page.paginator.num_pages > 1 %}<nav class="billing-pagination" aria-label="Paginación">{% if page.has_previous %}<a class="button button-secondary" href="?{{ filter_query }}&page={{ page.previous_page_number }}" hx-get="?{{ filter_query }}&page={{ page.previous_page_number }}" hx-target="{{ target }}" hx-swap="outerHTML" hx-push-url="true">Anterior</a>{% endif %}<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button button-secondary" href="?{{ filter_query }}&page={{ page.next_page_number }}" hx-get="?{{ filter_query }}&page={{ page.next_page_number }}" hx-target="{{ target }}" hx-swap="outerHTML" hx-push-url="true">Siguiente</a>{% endif %}</nav>{% endif %}
