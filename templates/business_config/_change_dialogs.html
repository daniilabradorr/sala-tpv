<dialog id="configuration-review-dialog" class="modal" data-nx-modal aria-labelledby="configuration-review-title">
 <div class="modal-panel"><h2 id="configuration-review-title">Revisar cambios</h2><div data-change-list></div>
 <div class="actions"><button type="button" class="button button-secondary" data-nx-modal-close>Seguir editando</button><button type="button" class="button" data-confirm-changes>Confirmar y guardar</button></div></div>
</dialog>
<dialog id="configuration-discard-dialog" class="modal" data-nx-modal aria-labelledby="configuration-discard-title">
 <div class="modal-panel"><h2 id="configuration-discard-title">Hay cambios sin guardar</h2><p>¿Quieres seguir editando o descartar los cambios?</p>
 <div class="actions"><button type="button" class="button button-secondary" data-nx-modal-close>Seguir editando</button><button type="button" class="button button-danger" data-discard-changes>Descartar cambios</button></div></div>
</dialog>
