<div class="form-field{% if field.errors %} form-field-error{% endif %}">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<div class="help-text">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="field-errors">{{ field.errors }}</div>{% endif %}
</div>
