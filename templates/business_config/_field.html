<div class="form-field{% if field.errors %} form-field-error{% endif %}" data-field="{{ field.name }}">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<div class="help-text" id="{{ field.id_for_label }}-help">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="field-errors" id="{{ field.id_for_label }}-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
