{% if field %}<div class="form-field{% if field.errors %} form-field-error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div id="{{ field.auto_id }}_helptext" class="help-text">{{ field.help_text }}</div>{% endif %}{% if field.errors %}<div id="{{ field.auto_id }}_error" class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endif %}
