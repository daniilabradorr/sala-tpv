{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Paginación"><a {% if page.has_previous %}href="?tab={{ tab_name }}&{{ extra_query }}page={{ page.previous_page_number }}" hx-get="?tab={{ tab_name }}&{{ extra_query }}page={{ page.previous_page_number }}" hx-target="#customer-workspace-content" hx-swap="outerHTML" hx-push-url="true"{% else %}aria-disabled="true"{% endif %}>Anterior</a><span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span><a {% if page.has_next %}href="?tab={{ tab_name }}&{{ extra_query }}page={{ page.next_page_number }}" hx-get="?tab={{ tab_name }}&{{ extra_query }}page={{ page.next_page_number }}" hx-target="#customer-workspace-content" hx-swap="outerHTML" hx-push-url="true"{% else %}aria-disabled="true"{% endif %}>Siguiente</a></nav>{% endif %}
