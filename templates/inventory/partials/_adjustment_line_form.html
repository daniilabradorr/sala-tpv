<section class="card-form" aria-labelledby="inventory-line-title">
  <header class="page-heading"><div><p class="erp-eyebrow">Ajuste {{ stock_adjustment.code }} · {{ stock_adjustment.store }}</p><h2 id="inventory-line-title">{% if stock_adjustment_line %}Editar{% else %}Añadir{% endif %} línea</h2></div>{% if request.htmx %}<button class="icon-button" type="button" data-nx-modal-close aria-label="Cerrar">×</button>{% endif %}</header>
  <form method="post" class="stacked-form" {% if request.htmx %}hx-post="{{ request.path }}" hx-target="#inventory-line-panel" hx-swap="innerHTML"{% endif %}>{% csrf_token %}{% include "inventory/_form_fields.html" %}<div class="actions"><button class="button" type="submit">Guardar línea</button>{% if request.htmx %}<button class="button button-secondary" type="button" data-nx-modal-close>Cancelar</button>{% else %}<a class="button button-secondary" href="{% url 'inventory:stock_adjustment_detail' stock_adjustment.pk %}">Cancelar</a>{% endif %}</div></form>
</section>
