{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Páginas">{% if page_obj.has_previous %}<a href="?tab={{ tab }}&page={{ page_obj.previous_page_number }}" hx-get="?tab={{ tab }}&page={{ page_obj.previous_page_number }}" hx-target="#inventory-item-tab" hx-swap="outerHTML" hx-push-url="true">Anterior</a>{% endif %}<span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?tab={{ tab }}&page={{ page_obj.next_page_number }}" hx-get="?tab={{ tab }}&page={{ page_obj.next_page_number }}" hx-target="#inventory-item-tab" hx-swap="outerHTML" hx-push-url="true">Siguiente</a>{% endif %}</nav>{% endif %}
