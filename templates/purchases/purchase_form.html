{% extends "base.html" %}
{% block title %}{% if is_create %}Nueva compra{% else %}Editar compra{% endif %} | Netxodo{% endblock %}
{% block content %}<section class="card"><h1>{% if is_create %}Nueva compra{% else %}Editar compra{% endif %}</h1><form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<button class="btn" type="submit">Guardar</button> <a class="btn" href="{% if purchase %}{% url 'purchases:purchase_detail' purchase.pk %}{% else %}{% url 'purchases:purchase_list' %}{% endif %}">Cancelar</a></form></section>{% endblock %}
