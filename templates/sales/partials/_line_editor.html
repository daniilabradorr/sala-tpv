<section class="line-editor" aria-labelledby="line-editor-title">
  <header class="line-editor__header">
    <div><span class="eyebrow">Ticket</span><h2 id="line-editor-title">{% if form.mode == "discount" %}Descuento de{% elif form.mode == "price" %}Precio de{% else %}Editar{% endif %} {{ line.product_name }}</h2></div>
    <button type="button" class="button button-secondary" data-nx-modal-close aria-label="Cerrar editor">×</button>
  </header>
  <form data-cart-line-id="{{ line.pk }}" method="post" action="{% url 'sales:sale_line_update' store.pk sale.pk line.pk %}{% if form.mode %}?mode={{ form.mode }}{% endif %}"
        hx-post="{% url 'sales:sale_line_update' store.pk sale.pk line.pk %}{% if form.mode %}?mode={{ form.mode }}{% endif %}"
        hx-sync="#sale-cart:queue all" hx-target="#line-editor-panel" hx-swap="innerHTML" hx-disabled-elt="button">
    {% csrf_token %}
    {% include "includes/erp_form_fields.html" %}
    <button type="submit" class="button">Guardar cambios</button>
  </form>
</section>
