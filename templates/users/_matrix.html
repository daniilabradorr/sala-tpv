<div class="access-matrix">{% for row in matrix.matrix_rows %}<fieldset class="access-row"><legend>{{ row.store.name }} {% if not row.store.is_active %}<span class="badge badge-inactive">Inactiva</span>{% endif %}</legend><label>{{ row.active }} Acceso</label><label>{{ row.sell }} Vender</label><label>{{ row.open }} Abrir caja</label><label>{{ row.close }} Cerrar caja</label></fieldset>{% empty %}<p>No hay tiendas.</p>{% endfor %}</div>
