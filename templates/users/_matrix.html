<div class="access-matrix" data-access-matrix>{% for row in matrix.matrix_rows %}<fieldset class="access-row" data-access-row><legend>{{ row.store.name }} {% if not row.store.is_active %}<span class="badge badge-inactive">Inactiva</span>{% endif %}</legend><label data-access-toggle>{{ row.active }} Acceso</label><div data-operational-permissions><label>{{ row.sell }} Vender</label><label>{{ row.open }} Abrir caja</label><label>{{ row.close }} Cerrar caja</label><small>Solo son efectivos con acceso activo.</small></div></fieldset>{% empty %}<p>No hay tiendas.</p>{% endfor %}</div>
