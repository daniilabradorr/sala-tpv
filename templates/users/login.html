{% extends "base.html" %}
{% load static %}
{% block title %}Iniciar sesión | Netxodo{% endblock %}
{% block public_content %}
<section class="card card-narrow login-card">
    <img src="{% static 'img/netxodo-logo.png' %}" alt="Netxodo" class="login-logo brand-logo">
    <div class="section-accent" aria-hidden="true"></div>
    <h1>Iniciar sesión</h1>
    <p class="intro">Accede con tu correo electrónico y contraseña.</p>
    <form method="post" class="stacked-form">
        {% csrf_token %}
        {% include "users/_form_fields.html" %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit" class="button">Iniciar sesión</button>
    </form>
</section>
{% endblock %}
